[package]
name        = "embeddings-nv"
version     = "0.1.0"
description = "The arithmetic between a model and a store: pooling a token-embedding matrix down to one vector (mean with an attention mask, CLS, last token, max), L2 normalisation, cosine, dot and Euclidean similarity for one pair and for one against many, top-k with scores, Matryoshka truncation, and quantisation to int8 with a shared scale and zero point or to binary with Hamming distance.  No model, no client, no store."
license     = "Apache-2.0"

# `experimental` because no program outside this repository has used the
# package yet.
stability   = "experimental"

# `core`: everything here is arithmetic over numbers the caller already
# holds.  Nothing loads a model, opens a socket, reads a clock or draws
# a random number, and there is not one effect row in the package.
#
# No `@tier(embedded)` claim — see README, "The layer, and the claim
# this package does not make".
layer       = "core"

category    = "ai"

tags        = ["embeddings", "similarity", "cosine", "pooling", "matryoshka", "quantization", "vector", "sans-io"]
repository  = "https://github.com/novolang/embeddings-nv"
maintainers = ["novo-lang"]
# 0.13.0 is the first toolchain with lists as reference types, which the
# bodies are written to.
novo        = ">= 0.13.0"

# A library: no `main`, so `novo pkg build` type-checks and
# effect-checks every module under `src/` and writes no binary.

[docs.pages]
"README.md" = "What happens between a model and a store"

[dependencies]
# ndarray-nv.  The subject of this package is a token-embedding matrix,
# sequence length by model dimension, sometimes with a batch in front of
# it, and a shape is what that is.  Pooling is a reduction along an
# axis and one query against a corpus is a matrix-vector product.
ndarray-nv = "^0.1.4"

# Not hnsw-nv: an index is built over what this package produces, and
# `ndfloat.to_list` of one row is the seam.  Not tokenizers-nv: the
# attention mask arrives with the matrix, as an argument.
